version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # keep the 3D stack in step with itself — these release together
      three:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
