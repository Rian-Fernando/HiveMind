name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Placeholder values only — nothing here reaches a real project.
        # Supabase and AI clients are constructed lazily at request time, so
        # the production build never needs live credentials.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GEMINI_API_KEY: placeholder
          GROQ_API_KEY: placeholder
        run: npm run build

      - name: Check public routes were generated
        run: |
          set -e
          for f in robots.txt sitemap.xml llms.txt; do
            if [ ! -e ".next/server/app/$f.body" ] && [ ! -e ".next/server/app/$f/route.js" ]; then
              echo "::error::$f was not generated by the build"
              exit 1
            fi
          done
          echo "robots.txt, sitemap.xml and llms.txt all present"
